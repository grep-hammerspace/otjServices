name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn -B test

  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: [self-hosted, otj-vm]
    steps:
      - uses: actions/checkout@v4
      - name: Build image locally on VM
        run: podman build -t localhost/otj-hours-api:latest -f docker/otjService.Dockerfile .
      - name: Restart service
        run: systemctl --user restart hours-api.service
      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8945/health && exit 0
            sleep 2
          done
          echo "Service did not become healthy" >&2
          exit 1
