name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - run: mvn -B test

  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required to request the OIDC token
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-2

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - working-directory: aws
        run: npm ci

      - working-directory: aws
        run: npx cdk deploy OtjServicesStack --require-approval never --outputs-file cdk-outputs.json

      - id: outputs
        working-directory: aws
        run: echo "instance_id=$(jq -r '.OtjServicesStack.InstanceId' cdk-outputs.json)" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr-login

      - name: Check if image already pushed
        id: image-check
        run: |
          if aws ecr describe-images --repository-name otj-hours-api \
               --image-ids imageTag=${{ github.sha }} --region eu-west-2 >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push image
        if: steps.image-check.outputs.exists == 'false'
        env:
          ECR_REPO: ${{ steps.ecr-login.outputs.registry }}/otj-hours-api
        run: |
          docker build -f docker/otjService.Dockerfile -t "$ECR_REPO:${{ github.sha }}" .
          docker push "$ECR_REPO:${{ github.sha }}"

      - name: Trigger deploy on the box via SSM
        id: trigger
        env:
          ECR_REPO: ${{ steps.ecr-login.outputs.registry }}/otj-hours-api
          INSTANCE_ID: ${{ steps.outputs.outputs.instance_id }}
        run: |
          IMAGE_URI="$ECR_REPO:${{ github.sha }}"
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "otjServices deploy ${{ github.sha }}" \
            --parameters "{\"commands\":[\"sudo -u otjapp -i /home/otjapp/otj-deploy/deploy.sh $IMAGE_URI\"]}" \
            --query "Command.CommandId" --output text)
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for deploy result
        env:
          INSTANCE_ID: ${{ steps.outputs.outputs.instance_id }}
          COMMAND_ID: ${{ steps.trigger.outputs.command_id }}
        run: |
          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Success)
                echo "Deploy succeeded (${{ github.sha }})."
                exit 0 ;;
              Failed|Cancelled|TimedOut)
                echo "Deploy failed — stderr from the box:" >&2
                aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
                  --query StandardErrorContent --output text >&2
                exit 1 ;;
            esac
            sleep 10
          done
          echo "Timed out waiting for SSM command to finish" >&2
          exit 1
