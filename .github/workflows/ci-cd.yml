name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - run: mvn -B test

  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required to request the OIDC token
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-2

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - working-directory: aws
        run: npm ci

      - working-directory: aws
        run: npx cdk deploy OtjServicesStack --require-approval never --outputs-file cdk-outputs.json

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr-login

      - name: Check if image already pushed
        id: image-check
        run: |
          if aws ecr describe-images --repository-name otj-hours-api \
               --image-ids imageTag=${{ github.sha }} --region eu-west-2 >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push image
        if: steps.image-check.outputs.exists == 'false'
        env:
          ECR_REPO: ${{ steps.ecr-login.outputs.registry }}/otj-hours-api
        run: |
          docker build -f docker/otjService.Dockerfile -t "$ECR_REPO:${{ github.sha }}" .
          docker push "$ECR_REPO:${{ github.sha }}"

      # No step here rolls the image out to the box. The hand-provisioned box, and deploy.sh with
      # it, went when the instance was replaced on 2026-09-25 (aws/README.md), and the one running
      # now is blank. The Ansible deploy (ansible-migration-plan.md) brings the rollout back in
      # deploy.yml. Until then a merge deploys the stack and publishes the image, and that's all.
