name: Build

on:
  push:
    branches: [tailscale]
  pull_request:
    branches: [tailscale]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # Unit tests, then the shaded jar.
      - run: mvn -B package

      - name: Build the image
        run: docker build -f docker/otjService.Dockerfile -t otj-services:ci .
