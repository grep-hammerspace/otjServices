name: converge-check

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Commit SHA to check against. Empty means the live one (/otj/prod/image-tag).
        required: false
        type: string

permissions:
  id-token: write
  contents: read

# Shared by every workflow that touches the box, so only one does at a time.
concurrency:
  group: box
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-2

      - name: Which release
        id: sha
        env:
          SHA: ${{ inputs.sha }}
        run: |
          if [ -z "$SHA" ]; then
            SHA=$(aws ssm get-parameter --name /otj/prod/image-tag --query Parameter.Value --output text) \
              || { echo "::error::Nothing is live yet (no /otj/prod/image-tag); give a SHA."; exit 1; }
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: otj-converge --check on the box
        run: .github/scripts/box-run.sh check "$SHA"
        env:
          SHA: ${{ steps.sha.outputs.sha }}
