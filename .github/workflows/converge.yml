# Apply a release to the box: its app image AND its box config (ansible-migration-plan.md §9.2).
# Also how the box is built the first time (ansible-deploy-checklist.md step 5).
name: converge

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full 40-character commit SHA whose image is in ECR
        required: true
        type: string

permissions:
  id-token: write # OIDC, for the deploy role
  contents: read

# One thing touches the box at a time: every box workflow, and deploy.yml, share this group.
concurrency:
  group: box
  cancel-in-progress: false

jobs:
  converge:
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-2

      # The input reaches the script through the environment, never interpolated into it, and
      # box-run.sh accepts only a full hex SHA.
      - name: otj-converge on the box
        run: .github/scripts/box-run.sh converge "$SHA"
        env:
          SHA: ${{ inputs.sha }}
