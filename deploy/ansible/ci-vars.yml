# The PR rehearsal's overrides. Never under group_vars/, so the box can't load them.

image_repo: localhost/otj-hours-api
app_image_archive: /tmp/otj-image.tar

render_env_source: fixture
render_env_fixture:
  mongo-uri: "{{ ci_mongo_uri }}"
  anthropic-api-key: dummy-not-a-key
  # 32 zero bytes: the api role won't start without a well-formed seed.
  credential-identity-seed: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
  admin-allowed-logins: ci@example.invalid
  grafana-cloud-logs-token: dummy-not-a-token

loki_push_url: http://127.0.0.1:3100/loki/api/v1/push
loki_user: ci
prom_remote_write_url: http://127.0.0.1:9090/api/v1/write
prom_user: ci
metrics_scrape_interval: 10s

# 127.0.0.1 is trusted so the job can test per-client buckets from loopback; the runner's own
# address stays untrusted.
edge_trusted_extra:
  - 127.0.0.1/32

verify_wildcard_allowed_extra: []
