- name: Packages the box needs
  ansible.builtin.apt:
    name:
      - podman
      - uidmap
      - slirp4netns
      - dbus-user-session
      - acl # lets Ansible `become_user: otjapp` from root without world-readable temp files
      - jq
      - unzip
      - curl
      - ansible-core
      - unattended-upgrades
    state: present
    update_cache: true
    cache_valid_time: 3600

# Never an automatic reboot: a reboot is an outage.
- name: Unattended upgrades on
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

- name: Unattended upgrades never reboot
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/52otj-unattended-upgrades
    mode: "0644"
    content: |
      Unattended-Upgrade::Automatic-Reboot "false";

- name: AWS CLI v2
  ansible.builtin.import_tasks: awscli.yml

# The cap stops the journal filling the disk. Persistent, because it holds the only copy of full
# client IPs.
- name: journald drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    mode: "0755"

- name: journald keeps a persistent, capped journal
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/otj.conf
    mode: "0644"
    content: |
      [Journal]
      Storage=persistent
      SystemMaxUse=500M
  notify: Restart journald

# Access is SSM only. sshd is socket-activated on 24.04, so both units are masked.
- name: sshd off
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: false
    masked: true
    state: stopped
  loop:
    - ssh.socket
    - ssh.service
