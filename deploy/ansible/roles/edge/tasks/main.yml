- name: HAProxy
  ansible.builtin.apt:
    name: haproxy
    state: present

# Never copied, templated or read: --diff would print the private key into CloudWatch and the
# Actions log.
- name: The origin certificate is in place
  ansible.builtin.stat:
    path: "{{ origin_cert_path }}"
    get_checksum: false
  register: edge_origin_cert

- name: It exists, and only root can read it
  ansible.builtin.assert:
    that:
      - edge_origin_cert.stat.exists
      - edge_origin_cert.stat.pw_name == 'root'
      - edge_origin_cert.stat.mode == '0600'
    fail_msg: >-
      {{ origin_cert_path }} must exist as root 0600, cert then key in one file. Issue one in the
      Cloudflare dashboard and install it over SSM: deploy/ansible/README.md, "Building a new
      box". Stopping here so HAProxy isn't left unable to start.
    quiet: true

- name: Cloudflare's ranges, the only sources whose CF-Connecting-IP is believed
  ansible.builtin.copy:
    content: |
      {{ lookup('ansible.builtin.file', playbook_dir ~ '/../haproxy/cloudflare-ips.lst') }}
      {% for cidr in edge_trusted_extra | default([]) %}
      {{ cidr }}
      {% endfor %}
    dest: /etc/haproxy/cloudflare-ips.lst
    owner: root
    group: root
    mode: "0644"
  notify: Reload haproxy

- name: haproxy.cfg
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../haproxy/haproxy.cfg"
    dest: /etc/haproxy/haproxy.cfg
    owner: root
    group: root
    mode: "0644"
    validate: haproxy -c -q -f %s
  notify: Reload haproxy

# journald drops everything past 10,000 messages per 30 s by default; a burst is when the access log
# matters.
- name: haproxy.service drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/haproxy.service.d
    state: directory
    mode: "0755"

- name: journald never drops HAProxy's access log
  ansible.builtin.copy:
    dest: /etc/systemd/system/haproxy.service.d/otj-logging.conf
    mode: "0644"
    content: |
      [Service]
      LogRateLimitIntervalSec=0
  notify:
    - Reload systemd
    - Restart haproxy

- name: HAProxy running
  ansible.builtin.systemd_service:
    name: haproxy
    enabled: true
    state: started
