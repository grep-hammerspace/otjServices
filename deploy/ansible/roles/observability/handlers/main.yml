- name: Regenerate Alloy's unit
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart alloy
  ansible.builtin.systemd_service:
    name: alloy.service
    state: restarted

# Retried: on a first run this follows the restart, while Alloy is still starting.
- name: Reload alloy
  ansible.builtin.uri:
    url: http://127.0.0.1:12345/-/reload
    method: POST
  register: observability_reload
  until: observability_reload.status == 200
  retries: 15
  delay: 2
