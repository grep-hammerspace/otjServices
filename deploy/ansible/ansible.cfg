# Read when ansible-playbook runs from this directory, which otj-converge and the PR rehearsal both
# do. Builtin modules only (ansible-migration-plan.md R5), written for the ansible-core 2.16 that
# Ubuntu 24.04 ships, which is what the box runs.
[defaults]
inventory = inventory.ini
roles_path = roles
interpreter_python = /usr/bin/python3
retry_files_enabled = False
host_key_checking = False
callback_result_format = yaml

[privilege_escalation]
become = False
