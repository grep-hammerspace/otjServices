# otjServices public edge: TLS termination and per-IP rate limiting for the main API.
#
# Installed to /etc/haproxy/haproxy.cfg by the `edge` role and checked with `haproxy -c` before it
# replaces the live file. It replaces the old box's Caddyfile (ansible-migration-plan.md D3), and
# every limit, header and timeout below is carried over from it. deploy/ansible/README.md has the
# reasoning at length. The comments here say what each line protects.
#
# ── This origin sits BEHIND the Cloudflare proxy (orange cloud) ──────────────────────────────
# otj-services.com resolves to Cloudflare, not to the Elastic IP, and the security group only
# admits Cloudflare's ranges on 443. Three things follow, and they only work as a set:
#   1. Every rate limit is keyed on `src` AFTER the `set-src` rewrite below, which makes it the
#      visitor's address. Before the rewrite, `src` is always a Cloudflare edge node: keying on
#      that would put the whole user base in one bucket and throttle everyone together.
#   2. The rewrite only happens for requests from Cloudflare's ranges (cloudflare-ips.lst). From
#      anywhere else CF-Connecting-IP is just a header the client chose, and believing it would let
#      anyone pick their own bucket.
#   3. TLS is a Cloudflare Origin CA certificate, installed by hand, not ACME (see `bind`).

global
    # To stdout, which systemd hands to journald under haproxy.service. No rsyslog socket inside
    # the chroot and no log file for anyone to own (the old box's Caddy log-ownership trap).
    log stdout format raw local0
    user haproxy
    group haproxy
    chroot /var/lib/haproxy
    # Only Cloudflare connects here, and it speaks TLS 1.2 and 1.3 to origins.
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets

defaults
    mode http
    log global
    option httplog
    option dontlognull
    # Headers must arrive promptly, and an idle keep-alive connection is closed soon.
    timeout http-request 10s
    timeout http-keep-alive 15s
    timeout connect 10s
    # GET /azure-id/complete holds the request open while it polls Microsoft for an MFA approval.
    # AzureIdDriver's budget is 40 × 3 s = 2 minutes, before the redirect chain and the OneAdvanced
    # POSTs that follow, and the app sends no response headers until all of that finishes. Both
    # sides need to clear that floor. (Cloudflare cuts off at 100 s regardless: plan R8.)
    timeout server 300s
    timeout client 300s

# ── Rate-limit counters, one table per zone ──────────────────────────────────────────────────
# `type ipv6` holds IPv4 addresses too, as v4-mapped. `expire` only has to outlive the window.
backend st_auth_burst
    stick-table type ipv6 size 100k expire 2m store http_req_rate(1m)
backend st_auth_daily
    stick-table type ipv6 size 100k expire 25h store http_req_rate(24h)
backend st_api_burst
    stick-table type ipv6 size 100k expire 2m store http_req_rate(1m)

frontend public
    # Cloudflare Origin CA: a free 15-year certificate only ever presented to Cloudflare, which is
    # the only thing that can connect. Visitors see Cloudflare's own certificate. Cloudflare's SSL
    # mode must be Full (strict), so it verifies this one. Cert then key, one file, 0600 root,
    # installed by hand and never touched by Ansible (plan §7). Two listeners, v4 and v6, so `ss`
    # shows exactly 0.0.0.0:443 and [::]:443, which is what verify allows.
    bind :443 ssl crt /etc/haproxy/certs/origin.pem alpn h2,http/1.1
    bind :::443 v6only ssl crt /etc/haproxy/certs/origin.pem alpn h2,http/1.1

    # First, before anything reads `src`: the visitor's address, from Cloudflare only. Cloudflare
    # sets CF-Connecting-IP itself and overwrites it on every request.
    http-request set-src req.hdr(CF-Connecting-IP) if { src -f /etc/haproxy/cloudflare-ips.lst } { req.hdr(CF-Connecting-IP) -m found }

    # The notes body on /log-activities is free text with no length bound of its own. This only
    # sees a declared Content-Length; Cloudflare buffers request bodies and sends one (verify).
    http-request deny deny_status 413 if { req.hdr_val(content-length) gt 1048576 }

    # ── Anonymous endpoints ──────────────────────────────────────────────────────────────────
    # Every request here costs a full bcrypt verify, including ones naming a user that doesn't
    # exist, because AuthResource verifies against DUMMY_HASH to keep the timing constant. That is
    # the cheapest way to burn the box's CPU, and a t3.small is burstable: sustained load drains
    # its credits and throttles everything on the host. The app's own limiter keys on the
    # submitted username, so it does nothing against an attacker who rotates usernames. This does.
    #
    # Cloudflare's WAF rule on the same paths (3 requests / 10 s) is NOT a duplicate: it permits
    # 18/min sustained, above the 10/min here, so a paced attacker passes the edge and is stopped
    # here. Don't relax these because that rule exists.
    acl anon path /auth/signup /auth/session
    # Uncapped: a monitor polling every 5 minutes is 288 requests a day, which would trip a daily
    # cap on its own and take the alerting down with it.
    acl health path /health

    http-request track-sc0 src table st_auth_burst if anon
    http-request track-sc1 src table st_auth_daily if anon
    # Authenticated traffic: a burst ceiling only. It already needs a bearer token, and the
    # expensive endpoint is bounded per user by LlmQuotaService. A daily per-IP cap here would
    # punish everyone behind a shared campus or carrier-NAT address for one person's usage.
    http-request track-sc2 src table st_api_burst if !anon !health

    # The counter includes the current request, so `gt 10` lets 10 through and refuses the 11th.
    # Retry-After is fixed per window rather than computed. The Expo client needs it present and
    # numeric: it's how the client tells this 429 apart from the app's own, and how it backs off.
    # The body is the old Caddyfile's (notes.md item 7).
    http-request return status 429 content-type application/json string '{"error": "Stop trying to DDoS me, get a life loser"}' hdr Retry-After 60 if anon { sc_http_req_rate(0) gt 10 }
    http-request return status 429 content-type application/json string '{"error": "Stop trying to DDoS me, get a life loser"}' hdr Retry-After 3600 if anon { sc_http_req_rate(1) gt 250 }
    http-request return status 429 content-type application/json string '{"error": "Stop trying to DDoS me, get a life loser"}' hdr Retry-After 60 if !anon !health { sc_http_req_rate(2) gt 120 }

    default_backend app

backend app
    option forwardfor
    # Loopback only. The app publishes on 127.0.0.1:8945 and nowhere else (AGENTS.md).
    server hours-api 127.0.0.1:8945
