# Behind Cloudflare. Rate limits key on `src` after the set-src rewrite below, so a bucket is a
# visitor rather than a Cloudflare node, and the rewrite trusts only Cloudflare's ranges, so no one
# else can pick their own bucket.

global
    log stdout format raw local0
    user haproxy
    group haproxy
    chroot /var/lib/haproxy
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets

defaults
    mode http
    log global
    # The truncated address goes first; the full one last as full_src=, for the local journal only.
    # Alloy cuts that field and drops any line still carrying it, so keep the name and keep it last.
    # Never capture the Authorization header.
    log-format "%[src,ipmask(24,48)] [%tr] %ft %b/%s %TR/%Tw/%Tc/%Tr/%Ta %ST %B %CC %CS %tsc %ac/%fc/%bc/%sc/%rc %sq/%bq %hr %hs %{+Q}r full_src=%ci:%cp"
    option dontlognull
    timeout http-request 10s
    timeout http-keep-alive 15s
    timeout connect 10s
    # GET /azure-id/complete holds the request open for about two minutes while it polls Microsoft.
    timeout server 300s
    timeout client 300s

backend st_auth_burst
    stick-table type ipv6 size 100k expire 2m store http_req_rate(1m)
backend st_auth_daily
    stick-table type ipv6 size 100k expire 25h store http_req_rate(24h)
backend st_api_burst
    stick-table type ipv6 size 100k expire 2m store http_req_rate(1m)

frontend public
    # Two listeners, so `ss` shows exactly 0.0.0.0:443 and [::]:443, which verify allows.
    bind :443 ssl crt /etc/haproxy/certs/origin.pem alpn h2,http/1.1
    bind :::443 v6only ssl crt /etc/haproxy/certs/origin.pem alpn h2,http/1.1

    # Before anything reads `src`, and only from Cloudflare's ranges: from anyone else the header is
    # client-chosen.
    http-request set-src req.hdr(CF-Connecting-IP) if { src -f /etc/haproxy/cloudflare-ips.lst } { req.hdr(CF-Connecting-IP) -m found }

    http-request deny deny_status 413 if { req.hdr_val(content-length) gt 1048576 }

    # Each request costs a bcrypt verify, even for an unknown user, and the app's limiter keys on
    # the username, so rotating usernames bypasses it. This doesn't. Cloudflare's WAF rule is looser
    # (18/min sustained): don't relax these because of it.
    acl anon path /auth/signup /auth/session
    # No daily cap: a 5-minute monitor alone would trip one.
    acl health path /health

    http-request track-sc0 src table st_auth_burst if anon
    http-request track-sc1 src table st_auth_daily if anon
    # A burst ceiling only: a daily per-IP cap would punish everyone behind a shared campus or
    # carrier-NAT address.
    http-request track-sc2 src table st_api_burst if !anon !health

    # The counter includes this request, so `gt 10` refuses the 11th. The client needs a numeric
    # Retry-After to tell this 429 from the app's.
    http-request return status 429 content-type application/json string '{"error": "Stop trying to DDoS me, get a life loser"}' hdr Retry-After 60 if anon { sc_http_req_rate(0) gt 10 }
    http-request return status 429 content-type application/json string '{"error": "Stop trying to DDoS me, get a life loser"}' hdr Retry-After 3600 if anon { sc_http_req_rate(1) gt 250 }
    http-request return status 429 content-type application/json string '{"error": "Stop trying to DDoS me, get a life loser"}' hdr Retry-After 60 if !anon !health { sc_http_req_rate(2) gt 120 }

    default_backend app

backend app
    option forwardfor
    server hours-api 127.0.0.1:8945
