services:
  mongo:
    image: docker.io/library/mongo:8
    restart: unless-stopped
    # Loopback only. Nothing outside this host has any business reaching the database directly,
    # and the box is on a tailnet where "outside this host" includes every other device on it.
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: otjdb
    volumes:
      - mongo_data:/data/db
    networks:
      - otj-net
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand(\"ping\")' || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 5s

  mongo-express:
    image: docker.io/library/mongo-express:latest
    restart: unless-stopped
    # Loopback only — this console has ME_CONFIG_BASICAUTH disabled, so anyone who can reach the
    # port owns the database.
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_USER}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_PASSWORD}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/
      ME_CONFIG_BASICAUTH: false
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - otj-net

  app:
    build:
      context: ..
      dockerfile: docker/otjService.Dockerfile
    # Named so the admin service can reuse the built image instead of running the Maven build
    # a second time.
    image: localhost/otj-services:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8945:8945"
      - "127.0.0.1:5005:5005"
    environment:
      APP_ROLE: api
      MONGO_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/otjdb?authSource=admin
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      JAVA_DEBUG: ${JAVA_DEBUG:-true}
      # Turns on the OtjDriver submission diagnostics — target URL, the exact JSON posted, and
      # OneAdvanced's rejection body. Defaults to INFO so the payload and learner ID stay out of
      # the log unless someone asks for them. Set OTJ_DRIVER_LOG_LEVEL=DEBUG to debug a failing
      # submission; it needs a container recreate, not an image rebuild.
      OTJ_DRIVER_LOG_LEVEL: ${OTJ_DRIVER_LOG_LEVEL:-INFO}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - otj-net

  # Invite-code administration. Same image as `app`, different entrypoint — see docker/start.sh.
  #
  # Reachable only through `tailscale serve` on the host (bootstrap.sh wires it to https://:8443).
  # The loopback publish is what makes the Tailscale-User-Login header trustworthy; if you change
  # it, AdminIdentityFilter stops being a security control. No ANTHROPIC_API_KEY: Dagger never
  # constructs the LLM client in this graph.
  admin:
    image: localhost/otj-services:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8946:8946"
    environment:
      APP_ROLE: admin
      MONGO_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/otjdb?authSource=admin
      ADMIN_ALLOWED_LOGINS: ${ADMIN_ALLOWED_LOGINS}
    depends_on:
      mongo:
        condition: service_healthy
      app:
        condition: service_started
    networks:
      - otj-net

networks:
  otj-net:
    driver: bridge

volumes:
  mongo_data:
    name: otj_mongo_data
