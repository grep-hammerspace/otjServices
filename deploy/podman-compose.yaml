services:
  mongo:
    image: docker.io/library/mongo:8
    restart: unless-stopped
    # Loopback only: on a tailnet, "outside this host" includes every other device.
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: otjdb
    volumes:
      - mongo_data:/data/db
    networks:
      - otj-net
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand(\"ping\")' || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 5s

  app:
    build:
      context: ..
      dockerfile: docker/otjService.Dockerfile
    image: localhost/otj-services:local
    restart: unless-stopped
    # Loopback only: the API has no auth, so tailscale serve must be the only way in.
    ports:
      - "127.0.0.1:8945:8945"
    environment:
      MONGO_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/otjdb?authSource=admin
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      # Defaulted in bootstrap.sh: podman-compose passes ${VAR:-default} through literally.
      OTJ_DRIVER_LOG_LEVEL: ${OTJ_DRIVER_LOG_LEVEL}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - otj-net

networks:
  otj-net:
    driver: bridge

volumes:
  mongo_data:
    name: otj_mongo_data
