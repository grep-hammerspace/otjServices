services:
  mongo:
    image: docker.io/library/mongo:8
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: otjdb
    volumes:
      - mongo_data:/data/db
    networks:
      - otj-net
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand(\"ping\")' || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 5s

  mongo-express:
    image: docker.io/library/mongo-express:latest
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_USER}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_PASSWORD}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/
      ME_CONFIG_BASICAUTH: false
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - otj-net

  app:
    build:
      context: ..
      dockerfile: docker/otjService.Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8945:8945"
      - "127.0.0.1:5005:5005"
    environment:
      MONGO_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/otjdb?authSource=admin
      LLM_API_KEY: ${LLM_API_KEY}
      # No ${VAR:-default} anywhere in this file: podman-compose does not implement that
      # operator and passes the literal text through as the value. AppModule.envOrDefault
      # and docker/start.sh own the defaults, and treat blank as unset.
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_MODEL: ${LLM_MODEL}
      PASSWORD_ENCRYPTION_KEY: ${PASSWORD_ENCRYPTION_KEY}
      JAVA_DEBUG: ${JAVA_DEBUG}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - otj-net

networks:
  otj-net:
    driver: bridge

volumes:
  mongo_data:
    name: otj_mongo_data
